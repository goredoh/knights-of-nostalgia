kind = "web"
previewPath = "/knights-web/"
title = "Knights of Nostalgia Website"
version = "1.0.0"
id = "artifacts/knights-web"
router = "path"

[[services]]
name = "web"
paths = [ "/knights-web/" ]
localPort = 21855

[services.development]
run = "pnpm --filter @workspace/knights-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knights-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/knights-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21855"
BASE_PATH = "/knights-web/"
